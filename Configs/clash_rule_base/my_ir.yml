mixed-port: 7890
ipv6: true
allow-lan: false
unified-delay: true
log-level: warning
mode: rule
tcp-concurrent: true
keep-alive-idle: 10
keep-alive-interval: 15
# ==========================================
profile:
  store-selected: true
  store-fake-ip: true
# ==========================================
external-controller: 127.0.0.1:9090
external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true
external-ui: ui
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
# ==========================================
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  respect-rules: true
  use-system-hosts: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
  hosts:
    "rule-set:malware": "rcode://refused"
    "rule-set:category-ads-all": "rcode://refused"
  nameserver:
    - "https://8.8.8.8/dns-query#✅Select"
  proxy-server-nameserver:
    - "8.8.8.8#DIRECT"
  direct-nameserver:
    - "8.8.8.8#DIRECT"
  direct-nameserver-follow-policy: true
  nameserver-policy:
    "rule-set:ir": "8.8.8.8#DIRECT"
# ==========================================
tun:
  enable: true
  stack: mixed
  auto-route: true
  strict-route: true
  auto-detect-interface: true
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  mtu: 9000
# ==========================================
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080, 8880, 2052, 2082, 2086, 2095]
    TLS:
      ports: [443, 8443, 2053, 2083, 2087, 2096]
# ==========================================
ntp:
  enable: true
  server: time.cloudflare.com
  port: 123
  interval: 30
# ==========================================
rule-providers:
  malware:
    type: http
    behavior: domain
    format: text
    url: "https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/malware.txt"
    path: ./ruleset/malware.txt
    interval: 86400
  malware-cidr:
    type: http
    behavior: ipcidr
    format: text
    url: "https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/malware-ip.txt"
    path: ./ruleset/malware-cidr.txt
    interval: 86400
  ir:
    type: http
    behavior: domain
    format: text
    url: "https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ir.txt"
    path: ./ruleset/ir.txt
    interval: 86400
  ircidr:
    type: http
    behavior: ipcidr
    format: text
    url: "https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ircidr.txt"
    path: ./ruleset/ircidr.txt
    interval: 86400
